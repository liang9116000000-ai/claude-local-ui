server {
    listen 80 default_server;
    server_name _;
    root /var/www/claude-local-ui;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 模型与绘图服务跑在用户自己的电脑上，经 SSH 反向隧道（本机 ssh -R 8811/8812）到这里。
    # 前端必须同源访问：公网 HTTP 页面直连 127.0.0.1 会被 Chrome 的本地网络访问策略
    # 拦截（net::ERR_BLOCKED_BY_LOCAL_NETWORK_ACCESS_CHECKS），同源请求则不受影响。
    location /v1/ {
        proxy_pass http://127.0.0.1:8811;   # 无末尾斜杠：/v1/... 原样转发
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;                # 对话是 SSE 流式响应，必须关闭缓冲
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /sd/ {
        proxy_pass http://127.0.0.1:8812/;  # 末尾斜杠：去掉 /sd 前缀后转发
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;            # CPU 出图约 2 分钟
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
